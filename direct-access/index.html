<!--
  PRIVACY BY DESIGN: this page runs entirely in the patient's browser.
  No form is submitted, nothing is stored (no cookies, no localStorage), no answers go in the URL,
  and no answers are ever sent anywhere. The only network call is an anonymous visit counter
  (GoatCounter: no cookies, no IP addresses stored) that records page views and four funnel totals
  (started / qualified / routed to office / routed to Monica) with NO answers attached.
  Never send answers, plan names, or anything typed. Collecting those would mean collecting PHI and
  would require a HIPAA-compliant platform with a BAA.
-->
<style>
:root{
  --bg:#f5f8f8; --surface:#ffffff; --ink:#0f2a33; --muted:#4e6770; --line:#d6e1e3;
  --accent:#0b6e75; --accent-ink:#ffffff; --accent-soft:#e0f0f0;
  --warn:#9a4a07; --warn-soft:#fdf1e3; --stop:#a1262b; --stop-soft:#fbe9ea;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a1f; --surface:#13252b; --ink:#e4eef0; --muted:#9ab1b8; --line:#26404a;
  --accent:#5cc3c8; --accent-ink:#06262a; --accent-soft:#163a40;
  --warn:#f0b36d; --warn-soft:#3a2912; --stop:#f08a8e; --stop-soft:#3d1a1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#13252b; --ink:#e4eef0; --muted:#9ab1b8; --line:#26404a;
  --accent:#5cc3c8; --accent-ink:#06262a; --accent-soft:#163a40;
  --warn:#f0b36d; --warn-soft:#3a2912; --stop:#f08a8e; --stop-soft:#3d1a1d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:0 48px}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2{font-family:var(--display);text-wrap:balance;line-height:1.22;margin:0}
h1{font-size:1.8rem;font-weight:650}
h2{font-size:1.38rem;font-weight:650}
h1:focus,h2:focus{outline:none}
p{margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:640px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:.9rem;letter-spacing:.02em;min-width:0}
.brand span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:none}
.seg button{font:inherit;font-size:.88rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.screen{padding-top:26px;display:grid;gap:16px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.card ul,.note ul,.ex{margin:0;padding-left:20px;display:grid;gap:4px}
.note{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.note.info{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)} .note.warn .eyebrow{color:var(--warn)}
.note.stop{background:var(--stop-soft)} .note.stop .eyebrow{color:var(--stop)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.yes .eyebrow{color:var(--accent)} .no .eyebrow{color:var(--stop)}

.choices{display:grid;gap:10px;margin-top:4px}
.choice{font:inherit;font-size:1.05rem;font-weight:600;text-align:left;min-height:56px;padding:14px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.yn{grid-template-columns:repeat(2,minmax(0,1fr))}
.yn .choice{justify-content:center;text-align:center;font-size:1.12rem}

.btn{font:inherit;font-weight:700;font-size:1.02rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;text-align:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.block{width:100%}
.linkbtn{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:grid;gap:10px}
.minor{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}

.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.bmi{display:grid;gap:12px}
.bmi-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.field input,.field select{font:inherit;font-size:1.1rem;padding:12px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.units{justify-self:start}
.bmi-out{font-variant-numeric:tabular-nums;font-weight:700}

.phonebig{display:block;font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;text-decoration:none;color:var(--accent)}
.placeholder{border:2px dashed var(--warn);border-radius:12px;padding:14px;color:var(--warn);font-weight:700}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.88rem}
.attest p+p{margin-top:8px}

.doc{display:flex;align-items:center;gap:14px}
.doc img,.signoff img{border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.doc b{display:block;font-size:1.02rem}
.signoff{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.signoff p+p{margin-top:2px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem;display:grid;gap:8px}
.phone{font-variant-numeric:tabular-nums;font-weight:600}

@media (max-width:520px){
  .cols{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.55rem}
  .brand span{display:none}
}
</style>

  var h = ''+
  '<div class="qhead"><div class="eyebrow">'+T({en:"Question ",es:"Pregunta "})+n+T({en:" of ",es:" de "})+tot+'</div>'+
  '<button type="button" class="linkbtn small" data-act="back">← '+T({en:"Back",es:"Atrás"})+'</button></div>'+
  '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+tot+'" aria-valuenow="'+(n-1)+'"><i style="width:'+Math.round((n-1)/tot*100)+'%"></i></div>'+
  '<h2>'+T(q.q)+'</h2>';
  if(q.list){ h += '<ul class="ex">'+q.list.map(function(x){return '<li>'+T(x)+'</li>';}).join('')+'</ul>'; }
  if(q.help){ h += '<p class="muted">'+T(q.help)+'</p>'; }

  if(q.type==="yn"){
    h += '<div class="choices yn">'+
      '<button type="button" class="choice" data-ans="yes" aria-pressed="'+(a==="yes")+'">'+T(YES)+'</button>'+
      '<button type="button" class="choice" data-ans="no" aria-pressed="'+(a==="no")+'">'+T(NO)+'</button></div>';
  } else if(q.type==="choice"){
    h += '<div class="choices">'+q.options.map(function(o){
      return '<button type="button" class="choice" data-ans="'+o.v+'" aria-pressed="'+(a===o.v)+'">'+T(o.l)+'</button>'; }).join('')+'</div>';
  } else if(q.type==="multi"){
    var sel = Array.isArray(a) ? a : [];
    h += '<div class="choices">'+q.options.map(function(o){
      return '<label class="check"><input type="checkbox" value="'+o.v+'"'+(sel.indexOf(o.v)>-1?' checked':'')+'><span>'+T(o.l)+'</span></label>'; }).join('')+'</div>'+
      '<button type="button" class="btn block" data-act="multi">'+T({en:"Continue",es:"Continuar"})+'</button>';
  } else if(q.type==="bmi"){
    var b = S.bmi, us = S.units==="us";
    var ftOpts = '<option value="">–</option>'; for(var f=4; f<=7; f++){ ftOpts += '<option value="'+f+'"'+(String(b.ft)===String(f)?' selected':'')+'>'+f+'</option>'; }
    var inOpts = '<option value="">–</option>'; for(var i=0; i<=11; i++){ inOpts += '<option value="'+i+'"'+(String(b.inch)===String(i)?' selected':'')+'>'+i+'</option>'; }
    h += '<div class="bmi">'+
      '<div class="units seg" role="group" aria-label="'+T({en:"Units",es:"Unidades"})+'">'+
        '<button type="button" data-units="us" aria-pressed="'+us+'">ft / lb</button>'+
        '<button type="button" data-units="metric" aria-pressed="'+(!us)+'">cm / kg</button></div>'+
      (us ?
        '<div class="bmi-row">'+
          '<label class="field">'+T({en:"Feet",es:"Pies"})+'<select id="b-ft">'+ftOpts+'</select></label>'+
          '<label class="field">'+T({en:"Inches",es:"Pulgadas"})+'<select id="b-in">'+inOpts+'</select></label></div>'+
        '<label class="field">'+T({en:"Weight (pounds)",es:"Peso (libras)"})+'<input id="b-lb" type="number" inputmode="decimal" min="70" max="700" value="'+esc(b.lb)+'" autocomplete="off"></label>'
      :
        '<div class="bmi-row">'+
          '<label class="field">'+T({en:"Height (cm)",es:"Estatura (cm)"})+'<input id="b-cm" type="number" inputmode="decimal" min="120" max="230" value="'+esc(b.cm)+'" autocomplete="off"></label>'+
          '<label class="field">'+T({en:"Weight (kg)",es:"Peso (kg)"})+'<input id="b-kg" type="number" inputmode="decimal" min="30" max="320" value="'+esc(b.kg)+'" autocomplete="off"></label></div>'
      )+
      '<p class="muted">'+T({en:"BMI: ",es:"IMC: "})+'<span class="bmi-out" id="b-out">–</span></p>'+
      '<button type="button" class="btn block" data-act="bmi" id="b-go" disabled>'+T({en:"Continue",es:"Continuar"})+'</button></div>';
  }
  return h;
}

function vFail(){
  var f = FAIL[S.failKey] || FAIL.visit;
  var urgent = f.urgent || (S.failQ && S.failQ.urgent);
  return ''+
  '<div class="eyebrow">'+T({en:"Next step",es:"Siguiente paso"})+'</div>'+
  '<h1>'+T(f.t)+'</h1>'+
  '<p>'+T(f.p)+'</p>'+
  (urgent ? '<div class="note stop"><div class="eyebrow">'+T({en:"Don't wait if it's severe",es:"No espere si es grave"})+'</div><p>'+
     T({en:"Heavy bleeding, severe belly pain, fainting, or black stools with dizziness: go to the nearest emergency room or call 911.",es:"Sangrado abundante, dolor abdominal fuerte, desmayos o heces negras con mareo: vaya a la sala de emergencias más cercana o llame al 911."})+'</p></div>' : '')+
  (f.prompt ? vPromptActions() :

    '<a class="btn block" href="'+CONFIG.bookUrl+'" target="_blank" rel="noopener">'+T({en:"Make an appointment with Dr. Andrade",es:"Hacer una cita con el Dr. Andrade"})+'</a>'+
    '<a class="btn ghost block" href="tel:'+CONFIG.office.tel+'">'+T({en:"Call the office: ",es:"Llame a la oficina: "})+CONFIG.office.display+'</a>'+

    '<button type="button" class="linkbtn small" data-act="undo">'+T({en:"Go back to that question",es:"Volver a esa pregunta"})+'</button>'+
    '<button type="button" class="linkbtn small" data-act="restart">'+T({en:"Start over",es:"Empezar de nuevo"})+'</button></div>';
}

  '<button type="button" class="btn block" data-act="attest" id="att-go"'+(S.attested?'':' disabled')+'>'+T({en:"Show my scheduling line",es:"Ver mi línea para programar"})+'</button>'+

    '<li>'+T({en:"Your date of birth",es:"Su fecha de nacimiento"})+'</li>'+
    '<li>'+T({en:"The best phone number to call you back, said slowly",es:"El mejor teléfono para devolverle la llamada, dicho despacio"})+'</li>'+
    '<li>'+T({en:"Your insurance company",es:"Su compañía de seguro"})+'</li></ul>'+
    '<p class="muted small">'+T({en:"No need to leave medical details. We'll go over everything when we call you back.",es:"No necesita dejar detalles médicos. Lo repasaremos todo cuando le devolvamos la llamada."})+'</p></div>'+

    '<li>'+T({en:"Your insurance card",es:"Su tarjeta del seguro"})+'</li>'+
    '<li>'+T({en:"A list of all your medicines and supplements, with doses",es:"Una lista de todos sus medicamentos y suplementos, con las dosis"})+'</li>'+
    '<li>'+T({en:"The date and place of any previous colonoscopy",es:"La fecha y el lugar de cualquier colonoscopia anterior"})+'</li></ul></div>'+

    T({en:"Screening colonoscopy is usually covered as preventive care. If a polyp is removed or a biopsy is taken, some plans, including Medicare, may charge a copay or coinsurance. Check with your insurance.",

    '<p><b>Christian M. Andrade, MD</b> · GastroMED · 5101 SW 8th St, Suite 200, Miami, FL 33134 · <span class="phone">'+CONFIG.office.display+'</span></p>'+

    '<p><a href="'+CONFIG.prepGuideUrl+'">'+T({en:"Colonoscopy prep guide",es:"Guía de preparación para colonoscopia"})+'</a></p>';

/* ================= FLOW ================= */
function answer(val){
  var q = Q[S.qi];
  S.answers[q.id] = val;
  var r = q.rule(q.type==="bmi" ? S.answers.bmiValue : val, S.answers);
  if(r && r.indexOf("fail:")===0){ S.failKey = r.slice(5); S.failQ = q; S.view = "fail"; track((FAIL[S.failKey]||{}).prompt ? "routed-monica" : "routed-office"); render(); focusHeading(); return; }
  if(S.qi < Q.length-1){ S.qi++; S.view="q"; } else { S.view = "attest"; }
  render(); focusHeading();
}

function bmiCalc(){
  var b = S.bmi, v = null;
  if(S.units==="us"){
    var ft = parseInt(b.ft,10), inch = parseInt(b.inch,10), lb = parseFloat(b.lb);
    var tin = ft*12 + (isNaN(inch)?0:inch);
    if(!isNaN(ft) && lb>=70 && lb<=700 && tin>=48 && tin<=90) v = 703*lb/(tin*tin);
  } else {
    var cm = parseFloat(b.cm), kg = parseFloat(b.kg);
    if(cm>=120 && cm<=230 && kg>=30 && kg<=320) v = kg/((cm/100)*(cm/100));
  }
  return v;
}
function bmiUpdate(){
  var v = bmiCalc(), out = document.getElementById("b-out"), go = document.getElementById("b-go");
  if(out) out.textContent = v ? v.toFixed(1) : "–";
  if(go) go.disabled = !v;
}

function bind(){
  root.querySelectorAll("[data-ans]").forEach(function(b){ b.addEventListener("click", function(){ answer(b.getAttribute("data-ans")); }); });
  root.querySelectorAll("[data-act]").forEach(function(b){ b.addEventListener("click", function(){ act(b.getAttribute("data-act")); }); });
  root.querySelectorAll("[data-units]").forEach(function(b){ b.addEventListener("click", function(){ S.units = b.getAttribute("data-units"); render(); }); });
  var map = {"b-ft":"ft","b-in":"inch","b-lb":"lb","b-cm":"cm","b-kg":"kg"};
  Object.keys(map).forEach(function(id){ var el = document.getElementById(id); if(el){ ["input","change"].forEach(function(ev){ el.addEventListener(ev, function(){ S.bmi[map[id]] = el.value; bmiUpdate(); }); }); } });
  if(document.getElementById("b-out")) bmiUpdate();
  var att = document.getElementById("att");
  if(att){ att.addEventListener("change", function(){ S.attested = att.checked; document.getElementById("att-go").disabled = !att.checked; }); }
}

function act(a){
  if(a==="start"){ S.view="q"; S.qi=0; track("started"); }
  else if(a==="back"){ if(S.view==="attest"){ S.view="q"; S.qi=Q.length-1; } else if(S.qi>0){ S.qi--; } else { S.view="intro"; } }
  else if(a==="undo"){ S.view="q"; }
  else if(a==="restart"){ S.view="intro"; S.qi=0; S.answers={}; S.failKey=null; S.failQ=null; S.attested=false; S.bmi={ft:"",inch:"",lb:"",cm:"",kg:""}; }
  else if(a==="multi"){ var sel=[]; root.querySelectorAll('.check input:checked').forEach(function(c){ sel.push(c.value); }); answer(sel); return; }
  else if(a==="bmi"){ var v = bmiCalc(); if(!v) return; S.answers.bmiValue = v; answer(Math.round(v*10)/10); return; }
  else if(a==="attest"){ if(!S.attested) return; S.view="pass"; track("qualified"); }
  render(); focusHeading();
}

/* Language: #es / #en in the link, else phone language. Nothing is stored. */
var h = (location.hash||"").replace("#","");
S.lang = h==="es" ? "es" : h==="en" ? "en" : ((navigator.language||"").toLowerCase().indexOf("es")===0 ? "es" : "en");
document.querySelectorAll("[data-set]").forEach(function(b){ b.addEventListener("click", function(){ S.lang = b.getAttribute("data-set"); render(); }); });
render();
})();
</script>
